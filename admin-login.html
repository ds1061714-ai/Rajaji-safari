<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description"
content="Rajaji Safari professional admin dashboard for managing safari bookings, payments and reservations.">

<meta name="theme-color" content="#071f13">

<title>Admin Dashboard | Rajaji Safari</title>

<style>

/* =====================================================
   RAJAJI SAFARI — ADMIN DASHBOARD
   PROFESSIONAL VERSION
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background:
    radial-gradient(
      circle at top right,
      rgba(40,140,76,.08),
      transparent 30%
    ),
    #f4f7f5;
  color:#172219;
}

/* =====================================================
   HEADER
===================================================== */

header{
  position:sticky;
  top:0;
  z-index:1000;

  min-height:72px;

  background:
    linear-gradient(
      135deg,
      #061b10 0%,
      #0b3d22 48%,
      #176b3a 100%
    );

  color:white;

  padding:12px 5%;

  display:flex;
  justify-content:space-between;
  align-items:center;

  box-shadow:
    0 8px 30px rgba(0,0,0,.20);
}

.logo-area{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo-icon{
  width:43px;
  height:43px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    rgba(255,255,255,.12);

  border:
    1px solid rgba(255,255,255,.18);

  border-radius:13px;

  font-size:23px;
}

.logo-text strong{
  display:block;
  font-size:18px;
  letter-spacing:.2px;
}

.logo-text span{
  display:block;
  margin-top:2px;
  font-size:10px;
  color:#cce8d5;
  letter-spacing:1px;
  text-transform:uppercase;
}

.header-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.admin-badge{
  display:flex;
  align-items:center;
  gap:6px;

  background:
    rgba(255,255,255,.10);

  border:
    1px solid rgba(255,255,255,.18);

  padding:9px 13px;

  border-radius:30px;

  font-size:12px;
}

.online-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#5cff8b;
  box-shadow:0 0 10px rgba(92,255,139,.7);
}

.logout{
  border:0;

  background:#e4ad3f;
  color:#172219;

  padding:10px 15px;

  border-radius:10px;

  font-weight:800;

  cursor:pointer;

  transition:.2s;
}

.logout:hover{
  transform:translateY(-1px);
  box-shadow:0 5px 15px rgba(0,0,0,.18);
}

/* =====================================================
   MAIN
===================================================== */

.container{
  width:min(1400px, 100%);
  margin:auto;

  padding:
    34px
    20px
    55px;
}

/* =====================================================
   PAGE TITLE
===================================================== */

.page-heading{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;

  gap:20px;

  margin-bottom:25px;
}

.title h1{
  font-size:32px;
  color:#0d522c;
  letter-spacing:-.5px;
}

.title p{
  margin-top:6px;
  color:#6d776f;
  font-size:14px;
}

.live-status{
  display:flex;
  align-items:center;
  gap:7px;

  padding:8px 12px;

  border-radius:20px;

  background:#e8f7ed;
  color:#176b3a;

  font-size:12px;
  font-weight:700;
}

.live-status i{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#1fa856;
}

/* =====================================================
   STATS
===================================================== */

.stats{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:16px;

  margin-bottom:25px;
}

.stat{
  position:relative;
  overflow:hidden;

  background:white;

  border:
    1px solid #e2ebe3;

  border-radius:18px;

  padding:21px;

  box-shadow:
    0 8px 30px rgba(18,52,31,.06);

  transition:
    transform .2s,
    box-shadow .2s;
}

.stat:hover{
  transform:translateY(-3px);

  box-shadow:
    0 12px 35px rgba(18,52,31,.11);
}

.stat::after{
  content:"";

  position:absolute;

  width:90px;
  height:90px;

  right:-30px;
  bottom:-40px;

  border-radius:50%;

  background:
    rgba(23,107,58,.05);
}

.stat-top{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:13px;
}

.stat-icon{
  width:42px;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:12px;

  background:#edf7ef;

  font-size:21px;
}

.stat-label{
  font-size:12px;
  color:#788179;
  font-weight:600;
}

.stat strong{
  display:block;

  color:#176b3a;

  font-size:28px;

  line-height:1.1;
}

.stat-sub{
  margin-top:6px;

  color:#89918b;

  font-size:11px;
}

/* =====================================================
   PANEL
===================================================== */

.panel{
  background:white;

  border:
    1px solid #e2e9e3;

  border-radius:22px;

  padding:23px;

  box-shadow:
    0 8px 32px rgba(0,0,0,.06);
}

.panel-top{
  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  margin-bottom:18px;
}

.panel-title{
  display:flex;
  align-items:center;
  gap:10px;
}

.panel-title-icon{
  width:40px;
  height:40px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#edf7ef;

  border-radius:11px;

  font-size:19px;
}

.panel-top h2{
  color:#14572f;
  font-size:20px;
}

.panel-top p{
  margin-top:3px;

  color:#89918b;

  font-size:11px;
}

.refresh{
  border:0;

  background:#176b3a;
  color:white;

  padding:10px 15px;

  border-radius:10px;

  font-weight:800;

  cursor:pointer;

  transition:.2s;
}

.refresh:hover{
  background:#0e542b;
  transform:translateY(-1px);
}

/* =====================================================
   TOOLBAR
===================================================== */

.toolbar{
  display:flex;

  align-items:center;

  gap:10px;

  margin-bottom:18px;
}

.search-box{
  position:relative;

  flex:1;
}

.search-icon{
  position:absolute;

  left:14px;
  top:50%;

  transform:translateY(-50%);

  color:#7c877e;

  font-size:15px;
}

.search{
  width:100%;

  padding:
    13px
    15px
    13px
    40px;

  border:
    1px solid #d9e2da;

  background:#fbfdfb;

  border-radius:11px;

  font-size:13px;

  transition:.2s;
}

.search:focus{
  outline:none;

  background:white;

  border-color:#176b3a;

  box-shadow:
    0 0 0 3px rgba(23,107,58,.08);
}

.booking-count{
  white-space:nowrap;

  background:#f0f5f1;

  color:#356046;

  padding:10px 13px;

  border-radius:10px;

  font-size:12px;

  font-weight:700;
}

/* =====================================================
   TABLE
===================================================== */

.table-wrap{
  overflow-x:auto;

  border:
    1px solid #e4ebe5;

  border-radius:15px;
}

table{
  width:100%;

  min-width:1100px;

  border-collapse:collapse;
}

thead th{
  background:#edf5ed;

  color:#245b38;

  padding:14px 11px;

  text-align:left;

  font-size:11px;

  text-transform:uppercase;

  letter-spacing:.4px;

  white-space:nowrap;
}

tbody td{
  padding:14px 11px;

  border-bottom:
    1px solid #e8eee9;

  font-size:12px;

  vertical-align:middle;
}

tbody tr:last-child td{
  border-bottom:0;
}

tbody tr{
  transition:.15s;
}

tbody tr:hover td{
  background:#f9fcfa;
}

.booking-id{
  color:#176b3a;
  font-weight:800;
}

.customer-name{
  font-weight:800;
  color:#25342a;
}

.customer-phone{
  margin-top:3px;
  color:#7b857e;
  font-size:11px;
}

.total-price{
  color:#14572f;
  font-weight:900;
}

/* =====================================================
   BADGES
===================================================== */

.badge{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  gap:5px;

  padding:6px 9px;

  border-radius:20px;

  font-size:10px;

  font-weight:800;

  white-space:nowrap;
}

.pending{
  background:#fff3cd;
  color:#806415;
}

.unpaid{
  background:#ffe9e9;
  color:#9b2929;
}

.paid{
  background:#dff5e5;
  color:#176b35;
}

.verified{
  background:#d8f0ff;
  color:#07547a;
}

.confirmed{
  background:#d8f0ff;
  color:#07547a;
}

.rejected{
  background:#ffe1e1;
  color:#9b2020;
}

/* =====================================================
   ACTIONS
===================================================== */

.actions{
  display:flex;

  flex-wrap:wrap;

  gap:5px;
}

.action{
  border:0;

  padding:7px 9px;

  border-radius:7px;

  font-size:10px;

  font-weight:800;

  cursor:pointer;

  transition:.18s;
}

.action:hover{
  transform:translateY(-1px);
  filter:brightness(.96);
}

.view{
  background:#edf2f7;
  color:#254b67;
}

.confirm{
  background:#176b3a;
  color:white;
}

.reject{
  background:#e74c3c;
  color:white;
}

.whatsapp{
  background:#25d366;
  color:white;
}

.delete{
  background:#303030;
  color:white;
}

/* =====================================================
   EMPTY
===================================================== */

.empty{
  text-align:center;

  padding:70px 15px;

  color:#777;
}

.empty-icon{
  width:65px;
  height:65px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin:
    0 auto 14px;

  background:#edf5ed;

  border-radius:50%;

  font-size:28px;
}

.empty h3{
  color:#334238;
  margin-bottom:5px;
}

.empty p{
  font-size:12px;
  color:#89918b;
}

/* =====================================================
   MODAL
===================================================== */

.modal{
  display:none;

  position:fixed;

  inset:0;

  z-index:2000;

  background:
    rgba(3,16,9,.72);

  backdrop-filter:
    blur(5px);

  padding:20px;

  align-items:center;
  justify-content:center;
}

.modal-card{
  width:100%;

  max-width:560px;

  max-height:90vh;

  overflow-y:auto;

  background:white;

  border-radius:22px;

  padding:24px;

  box-shadow:
    0 25px 80px rgba(0,0,0,.28);

  animation:
    modalIn .18s ease;
}

@keyframes modalIn{

  from{
    opacity:0;
    transform:translateY(15px) scale(.98);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }

}

.modal-header{
  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:18px;
}

.modal-title{
  display:flex;
  align-items:center;
  gap:10px;
}

.modal-title-icon{
  width:42px;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#edf7ef;

  border-radius:12px;

  font-size:20px;
}

.modal-header h2{
  color:#176b3a;
  font-size:20px;
}

.close{
  border:0;

  background:#f0f2f0;

  width:36px;
  height:36px;

  border-radius:50%;

  cursor:pointer;

  font-size:19px;

  color:#555;

  transition:.2s;
}

.close:hover{
  background:#e6e9e6;
}

.detail{
  display:flex;

  justify-content:space-between;

  gap:15px;

  padding:12px 0;

  border-bottom:
    1px solid #e5e9e5;

  font-size:13px;
}

.detail span{
  color:#727a74;
}

.detail strong{
  text-align:right;
  color:#26352b;
}

.modal-buttons{
  display:grid;

  gap:9px;

  margin-top:20px;
}

.modal-btn{
  border:0;

  padding:13px;

  border-radius:10px;

  font-weight:800;

  cursor:pointer;
}

.modal-confirm{
  background:#176b3a;
  color:white;
}

.modal-whatsapp{
  background:#25d366;
  color:white;
}

/* =====================================================
   FOOTER
===================================================== */

footer{
  text-align:center;

  padding:25px 15px 35px;

  color:#7b847d;

  font-size:11px;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1000px){

  .stats{
    grid-template-columns:
      repeat(2,1fr);
  }

}

@media(max-width:700px){

  header{
    padding:11px 15px;
  }

  .admin-badge{
    display:none;
  }

  .container{
    padding:
      24px
      10px
      45px;
  }

  .page-heading{
    align-items:flex-start;
    flex-direction:column;
  }

  .title h1{
    font-size:26px;
  }

  .live-status{
    align-self:flex-start;
  }

  .panel{
    padding:15px;
    border-radius:18px;
  }

  .panel-top{
    align-items:flex-start;
  }

  .panel-top h2{
    font-size:17px;
  }

  .toolbar{
    flex-direction:column;
    align-items:stretch;
  }

  .booking-count{
    text-align:center;
  }

}

@media(max-width:500px){

  .logo-text strong{
    font-size:16px;
  }

  .logo-text span{
    font-size:8px;
  }

  .logo-icon{
    width:38px;
    height:38px;
    font-size:20px;
  }

  .logout{
    padding:8px 10px;
    font-size:11px;
  }

  .stats{
    gap:10px;
  }

  .stat{
    padding:14px;
    border-radius:15px;
  }

  .stat-icon{
    width:35px;
    height:35px;
    font-size:17px;
  }

  .stat strong{
    font-size:21px;
  }

  .stat-label{
    font-size:10px;
  }

  .stat-sub{
    font-size:9px;
  }

  .modal{
    padding:10px;
  }

  .modal-card{
    padding:18px;
    border-radius:18px;
  }

}

/* =====================================================
   SCROLLBAR
===================================================== */

::-webkit-scrollbar{
  width:7px;
  height:7px;
}

::-webkit-scrollbar-track{
  background:#edf1ee;
}

::-webkit-scrollbar-thumb{
  background:#aab7ae;
  border-radius:10px;
}

::-webkit-scrollbar-thumb:hover{
  background:#718078;
}

</style>

</head>

<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

  <div class="logo-area">

    <div class="logo-icon">
      🐅
    </div>

    <div class="logo-text">

      <strong>
        Rajaji Safari
      </strong>

      <span>
        Management System
      </span>

    </div>

  </div>


  <div class="header-right">

    <div class="admin-badge">

      <span class="online-dot"></span>

      🔐 Administrator

    </div>


    <button
      class="logout"
      onclick="logout()">

      Logout

    </button>

  </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">


  <!-- PAGE HEADING -->

  <div class="page-heading">

    <div class="title">

      <h1>
        📊 Admin Dashboard
      </h1>

      <p>
        Manage safari bookings, payments and reservations.
      </p>

    </div>


    <div class="live-status">

      <i></i>

      System Online

    </div>

  </div>


  <!-- ===================================================
       STATS
  =================================================== -->

  <div class="stats">


    <div class="stat">

      <div class="stat-top">

        <div class="stat-icon">
          🎫
        </div>

        <span class="stat-label">
          BOOKINGS
        </span>

      </div>

      <strong id="totalBookings">
        0
